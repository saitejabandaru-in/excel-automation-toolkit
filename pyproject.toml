[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-automation-toolkit"
version = "0.1.0"
description = "Hybrid Excel and Python automation toolkit for cleaning data and generating reports."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Sai Teja Bandaru" }
]
dependencies = [
  "openpyxl>=3.1.2",
  "pandas>=2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
excel-automation = "excel_automation_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["excel_automation_toolkit*"]

